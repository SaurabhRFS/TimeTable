spring.application.name=timetable
# 1. Server Port: We run on 8080 so we don't clash with React (which uses 5173 or 3000)
server.port=8080

# 2. Database Connection
# "jdbc" stands for Java Database Connectivity.
# "localhost:3306" is where MySQL lives on your machine.
spring.datasource.url=jdbc:mysql://localhost:3306/kits_timetable_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate (The Magic ORM)
# "update": Automatically creates tables based on your Java classes.
# Warning: In a real company, we use "validate", but for this project, "update" saves time.
spring.jpa.hibernate.ddl-auto=update

# "show-sql": Prints the SQL queries in the console so we can debug.
spring.jpa.show-sql=true


# Global Configuration
app.frontend.url=http://localhost:5173